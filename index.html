<script>
(()=>{'use strict';
const KEY='reprise_v3';
const $=s=>document.querySelector(s);
const safe=(v,alt='')=>String(v??alt);
function localDateISO(d=new Date()){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function localMonthISO(d=new Date()){return localDateISO(d).slice(0,7)}
let state=load();let deferredInstall=null;let toastTimer;let currentView='plans';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return {name:v.name||localStorage.getItem('repr_name')||'',height:v.height||'',bodyWeight:v.bodyWeight||'',calorieGoal:v.calorieGoal||'',weighIns:Array.isArray(v.weighIns)?v.weighIns:[],foodLogs:Array.isArray(v.foodLogs)?v.foodLogs:[],customFoods:Array.isArray(v.customFoods)?v.customFoods:[],plans:Array.isArray(v.plans)?v.plans:[],history:Array.isArray(v.history)?v.history:[],activeId:v.activeId||null}}catch{return{name:localStorage.getItem('repr_name')||'',height:'',bodyWeight:'',calorieGoal:'',weighIns:[],foodLogs:[],customFoods:[],plans:[],history:[],activeId:null}}}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem('repr_name',state.name||'')}
function save(){saveLocal()}
function id(){return globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function button(text,cls,fn){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function field(placeholder,type='text',value='',label=placeholder){const i=el('input','field');i.type=type;i.placeholder=placeholder;i.value=safe(value);i.setAttribute('aria-label',label);return i}
function note(msg){const n=$('#toast');n.textContent=msg;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),2400)}
function getActive(){return state.plans.find(p=>p.id===state.activeId)||null}
function setView(view){currentView=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));['plans','library','gallery','history','profile','food','steps'].forEach(v=>{const section=$('#view-'+v);if(section)section.hidden=v!==view});if(view==='plans')renderPlans();if(view==='library')renderLibrary();if(view==='gallery')renderGallery();if(view==='history')renderHistory();if(view==='profile')renderProfile();if(view==='food')renderFood();if(view==='steps')renderSteps()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
function empty(title,desc,actionText,action){const box=el('div','empty');box.append(el('b','',title),el('div','',desc));if(actionText)box.append(button(actionText,'btn',action));return box}
function renderPlans(){const root=$('#view-plans');root.replaceChildren();const head=el('div','panel');const h=el('div','panel-head');const title=el('div');title.append(el('h2','', 'Mijn trainingsschema’s'),el('p','',`${state.plans.length} ${state.plans.length===1?'schema':'schema’s'} · helemaal zelf samengesteld`));h.append(title,button('+ Nieuw schema','btn',createPlan));head.append(h);
if(!state.plans.length){head.append(empty('Je hebt nog geen schema’s','Begin met een naam voor je eerste schema. Er staan geen voorbeeldschema’s in de app.','+ Maak mijn eerste schema',createPlan));root.append(head);return}
const list=el('div','plan-grid');state.plans.forEach(p=>{const tile=button('','plan-tile'+(p.id===state.activeId?' selected':''),()=>{state.activeId=p.id;save();renderPlans()});tile.append(el('strong','',p.name),el('span','',`${p.exercises.length} ${p.exercises.length===1?'oefening':'oefeningen'}`));list.append(tile)});head.append(list);root.append(head);
const p=getActive();if(!p){state.activeId=state.plans[0].id;save();renderPlans();return}
const editor=el('section','panel');const top=el('div','panel-head');const info=el('div');const name=field('Naam van je schema','text',p.name,'Schema naam');name.addEventListener('change',()=>{const val=name.value.trim();if(val){p.name=val;save();renderPlans()}});info.append(name,el('p','',`${p.exercises.length} oefeningen · pas alles hieronder zelf aan`));const delPlan=button('Verwijder schema','danger small',()=>{state.plans=state.plans.filter(x=>x.id!==p.id);state.activeId=state.plans[0]?.id||null;save();note('Schema verwijderd');renderPlans()});top.append(info,delPlan);editor.append(top);
if(!p.exercises.length)editor.append(empty('Nog geen oefeningen','Voeg zelf de oefeningen toe die jij in dit schema wilt doen.'));
p.exercises.forEach((ex,ei)=>editor.append(renderExercise(p,ex,ei)));
const addBox=el('div','');addBox.style.marginTop='18px';addBox.append(el('h3','','Oefening toevoegen'));const form=el('div','formgrid');const nm=field('Oefening, bijvoorbeeld squat','text','','Naam oefening');nm.classList.add('wide');const sets=field('Sets','number','','Aantal sets');sets.min='1';sets.max='30';sets.inputMode='numeric';const reps=field('Reps per set','text','','Doel reps per set');reps.placeholder='bijv. 8–10';const add=button('+ Oefening toevoegen','btn',()=>{const n=nm.value.trim(),sn=Number(sets.value),r=reps.value.trim();if(!n){nm.focus();note('Vul een oefening in');return}if(!Number.isInteger(sn)||sn<1||sn>30){sets.focus();note('Kies 1 tot 30 sets');return}if(!r){reps.focus();note('Vul je doelreps in');return}p.exercises.push({id:id(),name:n,sets:sn,reps:r,logs:Array.from({length:sn},()=>({kg:'',reps:''}))});save();renderPlans();note('Oefening toegevoegd')});form.append(nm,sets,reps,add);addBox.append(form);editor.append(addBox);
const finish=el('div','');finish.style.marginTop='18px';finish.append(button('✓ Training afronden en opslaan','btn',()=>saveWorkout(p)));editor.append(finish);root.append(editor)}
function renderExercise(p,ex,ei){const card=el('article','exercise');const header=el('div','exercise-head');const left=el('div');left.append(el('div','exercise-title',ex.name),el('div','exercise-meta',`${ex.sets} sets · doel ${ex.reps} reps`));const remove=button('Verwijder','danger small',()=>{p.exercises=p.exercises.filter(x=>x.id!==ex.id);save();note('Oefening verwijderd');renderPlans()});header.append(left,remove);card.append(header);const rows=el('div','sets');for(let si=0;si<ex.sets;si++){const log=ex.logs?.[si]||(ex.logs[si]={kg:'',reps:''});const row=el('div','setrow');row.append(el('span','setnum',`Set ${si+1}`));const kg=field('kg','number',log.kg,`Set ${si+1}, gewicht in kilo`);kg.step='0.5';kg.min='0';kg.inputMode='decimal';kg.addEventListener('input',()=>{log.kg=kg.value;save()});const reps=field('reps','number',log.reps,`Set ${si+1}, reps gedaan`);reps.min='0';reps.step='1';reps.inputMode='numeric';reps.addEventListener('input',()=>{log.reps=reps.value;save()});row.append(kg,reps,button('×','ghost small remove-set',()=>{ex.sets--;ex.logs.splice(si,1);if(ex.sets<1){p.exercises=p.exercises.filter(x=>x.id!==ex.id)}save();renderPlans()}));rows.append(row)}card.append(rows);const edit=el('div','formgrid');edit.style.marginTop='10px';const en=field('Naam oefening','text',ex.name,'Bewerk oefening naam');en.classList.add('wide');en.addEventListener('change',()=>{if(en.value.trim()){ex.name=en.value.trim();save();renderPlans()}});const es=field('Sets','number',ex.sets,'Bewerk aantal sets');es.min='1';es.max='30';es.addEventListener('change',()=>{const n=Number(es.value);if(n>=1&&n<=30){ex.sets=n;ex.logs=Array.from({length:n},(_,i)=>ex.logs[i]||({kg:'',reps:''}));save();renderPlans()}});const er=field('Doel reps','text',ex.reps,'Bewerk doel reps');er.placeholder='bijv. 8–10';er.addEventListener('change',()=>{if(er.value.trim()){ex.reps=er.value.trim();save();renderPlans()}});edit.append(en,es,er);card.append(edit);return card}
function createPlan(){const form=el('form','panel');const head=el('div','panel-head');head.append(el('div','','Nieuw schema maken'));form.append(head);const row=el('div','formgrid');const input=field('Naam, bijvoorbeeld Push of Full body','text','','Naam voor je nieuwe schema');input.classList.add('wide');const create=el('button','btn','Schema maken');create.type='submit';row.append(input,create);form.append(row);form.addEventListener('submit',e=>{e.preventDefault();const name=input.value.trim();if(!name){input.focus();return}const p={id:id(),name,exercises:[]};state.plans.push(p);state.activeId=p.id;save();note('Leeg schema aangemaakt');renderPlans()});const root=$('#view-plans');if(!state.plans.length){root.replaceChildren(form);input.focus()}else{root.prepend(form);input.focus()}}
function saveWorkout(p){if(!p.exercises.length){note('Voeg eerst oefeningen toe aan dit schema');return}const entry={id:id(),date:new Date().toISOString(),planName:p.name,items:p.exercises.map(e=>({name:e.name,sets:e.sets,reps:e.reps,logs:e.logs.map(x=>({kg:x.kg||'',reps:x.reps||''}))}))};state.history.unshift(entry);p.exercises.forEach(e=>e.logs=Array.from({length:e.sets},()=>({kg:'',reps:''})));save();note('Training opgeslagen; klaar voor de volgende keer');renderPlans()}
function renderHistory(){const root=$('#view-history');root.replaceChildren();const panel=el('div','panel');panel.append(el('div','panel-head',''));panel.firstChild.append(el('h2','','Trainingslog'),el('p','',`${state.history.length} opgeslagen trainingen`));if(!state.history.length){panel.append(empty('Nog geen trainingen opgeslagen','Rond een training af vanuit een van je eigen schema’s.'));root.append(panel);return}state.history.forEach(item=>{const row=el('div','history-item');const detail=el('div');detail.append(el('strong','',`${item.planName} · ${new Date(item.date).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}`));item.items.forEach(e=>{const sets=e.logs.map((s,i)=>`set ${i+1}: ${s.kg?s.kg+' kg':'—'} × ${s.reps||'—'} reps`).join(' · ');detail.append(el('small','',`${e.name} — ${sets}`))});row.append(detail,button('Verwijder','danger small',()=>{state.history=state.history.filter(x=>x.id!==item.id);save();note('Training uit log verwijderd');renderHistory()}));panel.append(row)});root.append(panel)}
function renderProfile(){const root=$('#view-profile');root.replaceChildren();const panel=el('div','panel');const h=el('div','panel-head');const d=el('div');d.append(el('h2','','Profiel & lichaamsgewicht'),el('p','',`Profiel van ${state.name||'—'}`));h.append(d);panel.append(h);const account=el('section','panel');const ah=el('div','panel-head');const ad=el('div');ad.append(el('h3','','Profiel op dit toestel'));ah.append(ad);account.append(ah);account.append(el('p','notice','Geen e-mailadres of wachtwoord nodig. Je gegevens staan lokaal in deze browser op dit toestel.'));panel.append(account);const grid=el('div','formgrid');const name=field('Je naam','text',state.name,'Je naam');const height=field('Lengte in cm','number',state.height,'Lengte in centimeters');height.min='50';height.max='250';height.step='1';const current=field('Huidig gewicht in kg','number',state.bodyWeight,'Huidig gewicht in kilo');current.min='0';current.step='.1';const target=field('Dagdoel kcal','number',state.calorieGoal,'Persoonlijk dagelijks caloriedoel');target.min='500';target.max='10000';target.step='50';const saveBtn=button('Profiel opslaan','btn',()=>{state.name=name.value.trim()||state.name;state.height=height.value;state.bodyWeight=current.value;state.calorieGoal=target.value;save();updateProfile();note('Profiel bijgewerkt');renderProfile()});grid.append(name,height,current,target,saveBtn);panel.append(grid);panel.append(el('p','notice','Je lengte, gewicht en caloriedoel worden lokaal bewaard. Een passend caloriedoel verschilt per persoon.'));
const weigh=el('section','panel');const wh=el('div','panel-head');const wd=el('div');wd.append(el('h2','','Maandelijkse weging'),el('p','', 'Voeg één weging per maand toe en bekijk hoe je gewicht verandert.'));wh.append(wd);weigh.append(wh);const row=el('div','formgrid');const month=field('Maand','month',localMonthISO(),'Maand van de weging');const kg=field('Gewicht in kg','number','','Gewicht in kilo');kg.min='0';kg.step='.1';const add=button('+ Weging opslaan','btn',()=>{if(!month.value||!Number(kg.value)){note('Kies een maand en vul je gewicht in');return}const record={id:id(),month:month.value,kg:Number(kg.value)};state.weighIns=state.weighIns.filter(x=>x.month!==record.month);state.weighIns.push(record);state.weighIns.sort((a,b)=>a.month.localeCompare(b.month));state.bodyWeight=String(record.kg);save();note('Weging opgeslagen');renderProfile()});row.append(month,kg,add);weigh.append(row);if(state.weighIns.length){const summary=el('div','weight-summary');const first=state.weighIns[0],last=state.weighIns.at(-1),diff=last.kg-first.kg;[[''+last.kg.toFixed(1),'Laatste weging'],[state.weighIns.length,'Maanden bijgehouden'],[`${diff>0?'+':''}${diff.toFixed(1)} kg`,'Verschil sinds start']].forEach(([v,l])=>{const c=el('div','stat');c.append(el('strong','',v),el('small','',l));summary.append(c)});weigh.append(summary,weightChart(state.weighIns));state.weighIns.slice().reverse().forEach(w=>{const r=el('div','history-item');r.append(el('strong','',`${new Date(w.month+'-15T12:00:00').toLocaleDateString('nl-NL',{month:'long',year:'numeric'})} · ${w.kg.toFixed(1)} kg`),button('Verwijder','danger small',()=>{state.weighIns=state.weighIns.filter(x=>x.id!==w.id);save();renderProfile()}));weigh.append(r)})}else weigh.append(empty('Nog geen wegingen','Voeg je eerste maandelijkse meting toe.'));panel.append(weigh);panel.append(el('p','notice','Lichaamsgewicht kan van dag tot dag schommelen. Kijk vooral naar je trend over meerdere maanden.'));root.append(panel)}
function weightChart(entries){const wrap=el('div','chart-wrap');const w=520,h=160,pad=28;const values=entries.map(x=>x.kg),min=Math.min(...values)-1,max=Math.max(...values)+1,range=Math.max(1,max-min);const pts=entries.map((x,i)=>`${pad+i*(w-pad*2)/Math.max(1,entries.length-1)},${h-pad-(x.kg-min)/range*(h-pad*2)}`).join(' ');wrap.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Grafiek van je maandelijkse gewicht"><defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#ff887e"/><stop offset="1" stop-color="#ff625c"/></linearGradient></defs><path d="M${pad} ${pad}V${h-pad}H${w-pad}" fill="none" stroke="#594246"/><polyline points="${pts}" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${entries.map((x,i)=>{const cx=pad+i*(w-pad*2)/Math.max(1,entries.length-1),cy=h-pad-(x.kg-min)/range*(h-pad*2);return `<circle cx="${cx}" cy="${cy}" r="5" fill="#ff887e"/><text x="${cx}" y="${h-5}" text-anchor="middle" class="chart-label">${new Date(x.month+'-15T12:00:00').toLocaleDateString('nl-NL',{month:'short'})}</text>`}).join('')}</svg>`;return wrap}

function exerciseTags(x){const t=(x.n+' '+x.group).toLowerCase(),tags=[];const add=(label,ok)=>{if(ok&&!tags.includes(label))tags.push(label)};const chest=/borst|chest/.test(t),back=/rug|bovenrug|lat|trapezius/.test(t),shoulders=/schouder|delt/.test(t),bi=/biceps/.test(t),tri=/triceps/.test(t),legs=/benen|quadriceps|hamstring|bovenbenen|sch\.?en|kuiten/.test(t),glutes=/billen|glute/.test(t),core=/core|buik|romp|onderrug|schuine buik/.test(t),arms=bi||tri||/onderarmen|grip/.test(t);add('Push',chest||shoulders||tri);add('Pull',back||bi||/achterkant schouders/.test(t));add('Armen',arms);add('Borst',chest);add('Rug',back);add('Schouders',shoulders);add('Biceps',bi);add('Triceps',tri);add('Onderarmen',/onderarmen|grip/.test(t));add('Benen',legs);add('Billen',glutes);add('Hamstrings',/hamstring/.test(t));add('Quadriceps',/quadriceps/.test(t));add('Kuiten',/kuiten|calf/.test(t));add('Core',core);add('Conditie',/conditie|cardio/.test(t));add('Full body',/farmer carry|suitcase carry|kettlebell swing|sled push/.test(t));if(!tags.length)tags.push('Full body');return tags}
function exerciseTechnique(m){const all={push:['Ga stabiel liggen of staan en span je romp licht aan. Houd het gewicht onder controle.','Laat het gewicht rustig zakken tot een comfortabele, pijnvrije positie. Duw het daarna terug naar de start.','Adem in tijdens het laten zakken en uit tijdens het duwen.','Houd polsen recht en beweeg zonder te stuiteren; forceer geen pijnlijke bewegingsuitslag.'],verticalPush:['Zet je voeten stevig neer en houd de gewichten naast je schouders. Span je buik aan.','Duw gecontroleerd omhoog tot je armen bijna gestrekt zijn. Laat terugzakken tot schouderhoogte.','Adem uit bij het omhoog duwen en in bij het zakken.','Hol je onderrug niet overdreven en duw niet door scherpe schouderpijn.'],fly:['Zet je romp stevig en houd je ellebogen licht gebogen. Begin met een comfortabele rek.','Breng je armen in een ruime boog naar elkaar toe. Keer rustig terug zonder de schouders naar voren te trekken.','Adem uit bij het samenbrengen en in bij het teruggaan.','Gebruik lichte weerstand en forceer de rek niet.'],row:['Zit of sta stabiel met je romp aangespannen en armen gestrekt.','Trek je ellebogen naar je romp. Pauzeer kort en strek je armen langzaam terug.','Adem uit tijdens het trekken en in bij het teruggaan.','Trek niet met vaart en laat je schouders niet optrekken.'],pulldown:['Zit of hang stevig en houd je romp lang. Pak de stang of handgrepen comfortabel vast.','Trek je ellebogen omlaag richting je zij. Strek je armen daarna gecontroleerd terug.','Adem uit tijdens het trekken en in bij het uitstrekken.','Trek de stang voor je lichaam; niet achter je nek en niet met zwaai.'],curl:['Sta of zit stabiel met je bovenarmen dicht bij je zij. Houd je polsen recht.','Buig je ellebogen en breng het gewicht omhoog. Laat langzaam terugzakken.','Adem uit bij het optillen en in bij het zakken.','Zwaai niet met je romp en beweeg je schouders zo weinig mogelijk.'],extension:['Houd je bovenarmen rustig en je romp stabiel. Begin met licht gewicht.','Strek je ellebogen tegen de weerstand in en buig ze daarna langzaam terug.','Adem uit bij het strekken en in bij het teruggaan.','Beweeg vanuit je ellebogen; forceer het gewricht niet.'],squat:['Zet je voeten stevig neer op ongeveer schouderbreedte. Houd je borst en romp stabiel.','Buig heupen en knieën en zak zo ver als comfortabel lukt. Duw jezelf via je hele voet weer omhoog.','Adem in tijdens het zakken en uit bij het omhoog komen.','Houd je knieën in lijn met je voeten en stop als je houding wegvalt.'],lunge:['Sta stevig en houd je romp recht. Zet een comfortabele stap naar voren, achteren of op een verhoging.','Buig je knieën gecontroleerd. Duw via de voorste voet terug of stap rustig door.','Adem in bij het zakken en uit bij het terugduwen.','Houd je knie in lijn met je voet en gebruik steun als je balans nodig hebt.'],hinge:['Sta met een lichte kniebuiging en houd het gewicht dicht bij je lichaam.','Duw je heupen naar achteren met een stabiele rug. Kom terug door je heupen naar voren te bewegen.','Adem in bij het naar achteren bewegen en uit bij het rechtop komen.','Maak er geen squat van en stop zodra je je rug niet meer stabiel kunt houden.'],bridge:['Ga stevig liggen of leun met je bovenrug tegen een bankje. Zet je voeten stabiel neer.','Duw je heupen omhoog door je billen aan te spannen. Laat langzaam zakken.','Adem uit bij het omhoog duwen en in bij het zakken.','Overstrek je onderrug niet bovenin.'],legExtension:['Stel de machine zo af dat de as bij je knie zit. Houd je rug tegen de leuning.','Strek je knieën rustig tegen het kussen en laat het gewicht gecontroleerd zakken.','Adem uit bij het strekken en in bij het zakken.','Schop niet met vaart en gebruik alleen een pijnvrije bewegingsuitslag.'],legCurl:['Stel de machine af zodat de rol comfortabel bij je onderbenen zit. Houd je heupen op het kussen.','Buig je knieën en trek de rol naar je toe. Strek langzaam terug.','Adem uit bij het buigen en in bij het teruggaan.','Til je heupen niet op en laat het gewicht niet vallen.'],calf:['Sta of zit stabiel met de bal van je voet op het platform. Laat je hielen comfortabel zakken.','Duw je hielen omhoog, pauzeer kort en laat ze rustig zakken.','Adem uit bij het omhoog komen en in bij het zakken.','Veer niet onderin en gebruik steun als je balans nodig hebt.'],plank:['Plaats je onderarmen of handen stevig neer en houd je lichaam in een rechte lijn.','Span buik en billen aan en houd de positie rustig vast terwijl je blijft ademen.','Adem rustig door; houd je adem niet vast.','Laat je onderrug niet doorzakken. Stop als je rug pijn doet.'],core:['Ga stabiel liggen of staan en span je buik licht aan. Beweeg rustig en gecontroleerd.','Voer de herhaling uit zonder je onderrug te forceren. Keer langzaam terug naar de start.','Adem uit tijdens het inspannen en in tijdens het teruggaan.','Gebruik geen vaart en houd de beweging pijnvrij.'],raise:['Sta of zit rechtop met lichte gewichten en ontspannen schouders.','Til het gewicht gecontroleerd op tot een comfortabele hoogte en laat langzaam zakken.','Adem uit bij het optillen en in bij het zakken.','Zwaai niet en trek je schouders niet richting je oren.'],kickback:['Houd je romp en heupen stabiel en begin met lichte weerstand.','Duw je been gecontroleerd naar achteren. Keer rustig terug zonder je onderrug hol te trekken.','Adem uit bij het duwen en in bij het teruggaan.','Beweeg vanuit je heup en draai je bekken niet mee.'],abduction:['Zit of sta stabiel en houd je bekken recht. Begin met een lichte weerstand.','Beweeg je benen rustig uit elkaar of naar elkaar toe tegen de weerstand. Keer gecontroleerd terug.','Adem uit tijdens de inspanning en in bij het teruggaan.','Gebruik geen vaart en maak de beweging niet groter dan comfortabel.'],carry:['Pak het gewicht stevig vast, sta rechtop en span je romp aan.','Loop rustig en gecontroleerd met korte passen. Zet het gewicht veilig neer.','Adem rustig door tijdens het lopen.','Houd je schouders laag en voorkom dat je romp naar één kant helt.'],cardio:['Stel het toestel passend af en begin rustig. Kies een tempo waarop je controle houdt.','Beweeg gelijkmatig en verhoog de intensiteit geleidelijk als dat goed voelt.','Blijf gelijkmatig ademen en vertraag om rustig af te bouwen.','Stop bij pijn, duizeligheid of benauwdheid die niet normaal voelt.']};return all[m]||all.core}

function renderLibrary(){const root=$('#view-library');root.replaceChildren();const intro=el('section','panel');const h=el('div','panel-head');const d=el('div');d.append(el('h2','','Oefeningenbibliotheek'),el('p','',`${EXERCISES.length} oefeningen · zoek of filter op trainingsdag en spiergroep`));h.append(d);intro.append(h);const search=field('Zoek oefening, spiergroep of materiaal','search','','Zoek in oefeningen');search.classList.add('library-search');intro.append(search);intro.append(el('div','notice','Uitleg is tekstueel; uitvoering verschilt per lichaam en apparaat. Begin licht en stop bij scherpe pijn.'));const filterBox=el('div','library-filters');const filters=['Alle','Push','Pull','Armen','Schouders','Borst','Rug','Biceps','Triceps','Onderarmen','Benen','Billen','Hamstrings','Quadriceps','Kuiten','Core','Conditie','Full body'];let active='Alle';const grid=el('div','guide-grid');root.append(intro,filterBox,grid);function draw(){filterBox.replaceChildren();grid.replaceChildren();const q=search.value.trim().toLowerCase();const items=EXERCISES.filter(x=>{const tags=exerciseTags(x),text=(x.n+' '+x.group+' '+x.equipment+' '+tags.join(' ')).toLowerCase();return(!q||text.includes(q))&&(active==='Alle'||tags.includes(active))});for(const category of filters){const count=category==='Alle'?EXERCISES.length:EXERCISES.filter(x=>exerciseTags(x).includes(category)).length;const chip=button(`${category} · ${count}`,'filter-chip'+(category===active?' active':''),()=>{active=category;draw()});filterBox.append(chip)}items.forEach(x=>grid.append(guideCard(x)));if(!items.length)grid.append(empty('Geen oefening gevonden','Probeer een andere zoekterm.'))}search.addEventListener('input',draw);draw()}
function guideCard(x){const card=el('article','guide-card');const body=el('div','guide-body');body.append(el('h3','',x.n),el('p','',`${x.group} · ${x.equipment}`));const det=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Bekijk stap voor stap';det.append(summary);const ol=document.createElement('ol');[['Startpositie',x.start],['Beweging',x.move],['Ademhaling',x.breathe],['Let hierop',x.avoid]].forEach(([a,b])=>{const li=document.createElement('li');li.textContent=a+': '+b;ol.append(li)});det.append(ol);body.append(det);const actions=el('div','guide-actions');actions.append(el('span','muted','Stapsgewijze uitleg'),button('＋ In schema','ghost small',()=>addLibraryExercise(x)));body.append(actions);card.append(body);return card}
function addLibraryExercise(x){const p=state.plans.find(p=>p.id===state.activeId)||state.plans[0];if(!p){note('Maak eerst je eigen schema aan');setView('plans');return}p.exercises.push({id:id(),name:x.n,sets:3,reps:'8–12',logs:Array.from({length:3},()=>({kg:'',reps:''}))});state.activeId=p.id;save();note(`${x.n} toegevoegd aan ${p.name}`);setView('plans')}

let photoDbPromise;
function photoDb(){if(!('indexedDB'in window))return Promise.reject(Error('Lokale fotobewaring wordt niet ondersteund in deze browser.'));if(!photoDbPromise)photoDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('reprise-private-gallery',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return photoDbPromise}
function dbRequest(mode,fn){return photoDb().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('photos',mode),store=tx.objectStore('photos');let req;try{req=fn(store)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)}))}

async function startStepSensor(promptPermission){if(!('DeviceMotionEvent'in window)){note('Deze browser biedt geen bewegingssensor; gebruik handmatig toevoegen');return}try{if(promptPermission&&typeof DeviceMotionEvent.requestPermission==='function'){const permission=await DeviceMotionEvent.requestPermission();if(permission!=='granted'){note('Geef toestemming voor bewegingssensor om stappen te tellen');return}}if(!sensorActive){readSteps();motionBaseline=9.8;stepArmed=true;stepPeakSamples=0;stepListener=e=>{let signal;const a=e.acceleration;if(a&&a.x!=null&&a.y!=null&&a.z!=null){signal=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)}else{const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null||g.z==null)return;const magnitude=Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z);motionBaseline=motionBaseline*.92+magnitude*.08;signal=Math.abs(magnitude-motionBaseline)}const now=Date.now();if(signal<0.65){stepArmed=true;stepPeakSamples=0}else if(stepArmed&&signal>1.45)stepPeakSamples++;else if(signal<=1.45)stepPeakSamples=0;if(stepArmed&&stepPeakSamples>=2&&now-lastStepAt>450){stepCount++;lastStepAt=now;stepArmed=false;stepPeakSamples=0;writeSteps();const n=$('#view-steps');if(n&&!n.hidden)renderSteps()}};window.addEventListener('devicemotion',stepListener);sensorActive=true;localStorage.setItem('repr_steps_enabled','yes');note('Stappenteller staat aan zolang RepRise open is');renderSteps()}}catch{note('Geen toegang tot de bewegingssensor; voeg stappen handmatig toe')}}

$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const n=$('#nameInput').value.trim();if(!n)return;state.name=n;saveLocal();updateProfile();note(`Welkom, ${n}`);maybeShowCompliment();if(!localStorage.getItem('repr_steps_enabled'))startStepSensor(true)});$('#profileBtn').addEventListener('click',()=>{if(!state.name){$('#gate').hidden=false;$('#nameInput').focus()}else setView('profile')});
$('#today').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});$('#installBtn').addEventListener('click',async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}const ua=navigator.userAgent; if(/iPhone|iPad|iPod/.test(ua))note('Installeren op iPhone/iPad: tik op Deel → Zet op beginscherm');else if(/Android/i.test(ua))note('Tik in Chrome op ⋮ → App installeren of Toevoegen aan startscherm');else note('Kies in je browsermenu voor Installeren of Toevoegen aan startscherm')});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
updateProfile();setView('plans');if(state.name)maybeShowCompliment();
})();
</script></body></html>
